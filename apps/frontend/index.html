<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NAM Conference Survey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      // FOUC Prevention: Apply theme before React loads
      (function() {
        const getColorScheme = () => {
          const stored = localStorage.getItem('mantine-color-scheme');
          if (stored === 'light' || stored === 'dark') {
            return stored;
          }
          return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        };

        const colorScheme = getColorScheme();
        document.documentElement.setAttribute('data-mantine-color-scheme', colorScheme);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
